

source = ~/.config/hypr/colors.conf

general {
    gaps_in = 3
    gaps_out = 7

    border_size = 0

    col.active_border = $outline
    col.inactive_border = $outline_variant


}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 20
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.85
    dim_inactive = true
    dim_strength = 0.1
    dim_special = 0.75

    shadow {
        enabled = false
        range = 4
        render_power = 1
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 5
        passes = 3
 	ignore_opacity = true
    	new_optimizations = true
    	special = false
    	popups = true
    	xray = false
	
        vibrancy = 0.1696
    }
}

debug {
    damage_tracking = 0
}

