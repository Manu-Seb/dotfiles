windowrule = match:tag multimedia_video, match:class ^([Mm]pv|vlc)$
windowrule = match:tag settings, match:class ^(nm-applet|nm-connection-editor|blueman-manager|org.gnome.FileRoller)$
windowrule = match:tag settings, match:class ^(org.gnome.DiskUtility|wihotspot(-gui)?)$
windowrule = match:tag viewer, match:class ^(org.gnome.SystemMonitor)$ # system monitor
windowrule = match:tag viewer, match:class ^(org.gnome.Evince)$ # document viewer 
windowrule = match:tag viewer, match:class ^(eog|org.gnome.Loupe)$ # image viewer
