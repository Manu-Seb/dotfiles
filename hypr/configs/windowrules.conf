
# browser tags
windowrule = tag +browser, match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$
windowrule = tag +browser, match:class ^([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable))$
windowrule = tag +browser, match:class ^(Brave-browser(-beta|-dev|-unstable)?)$
windowrule = tag +browser, match:class ^([Tt]horium-browser|[Cc]achy-browser)$
windowrule = tag +browser, match:class ^(zen-alpha|zen)$

# other tags (fixed syntax)
windowrule = tag +terminal, match:class ^(Alacritty|kitty|kitty-dropterm)$
windowrule = tag +email, match:class ^([Tt]hunderbird|org.gnome.Evolution|eu.betterbird.Betterbird)$
windowrule = tag +projects, match:class ^(codium|codium-url-handler|VSCodium|VSCode|code-url-handler|jetbrains-.+)$
windowrule = tag +im, match:class ^([Dd]iscord|[Ww]ebCord|[Vv]esktop|[Ww]hatsapp-for-linux|org.telegram.desktop|io.github.tdesktop_x64.TDesktop|teams-for-linux|im.riot.Riot|Element)$
windowrule = tag +screenshare, match:class ^(com.obsproject.Studio)$
windowrule = tag +games, match:class ^(gamescope|steam_app_\d+)$
windowrule = tag +gamestore, match:class ^([Ss]team|com.heroicgameslauncher.hgl)$
windowrule = tag +file-manager, match:class ^([Tt]hunar|org.gnome.Nautilus|[Pp]cmanfm-qt|app.drey.Warp)$
windowrule = tag +wallpaper, match:class ^([Ww]aytrogen)$
windowrule = tag +multimedia, match:class ^([Aa]udacious)$
windowrule = tag +multimedia_video, match:class ^([Mm]pv|vlc)$
windowrule = tag +settings, match:title ^(ROG Control|Kvantum Manager )$
windowrule = tag +popup_settings, match:class ^(blueman-manager|org.pulseaudio.pavucontrol)$
windowrule = tag +KooL-Settings, match:class ^(nwg-displays|nwg-look)$
windowrule = tag +KooL_Cheat, match:title ^(KooL Quick Cheat Sheet)$
windowrule = tag +KooL_Settings, match:title ^(KooL Hyprland Settings)$
windowrule = tag +viewer, match:class ^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter.MissionCenter|evince|eog|org.gnome.Loupe)$

# 2. WORKSPACE RULES (fixed match:workspace syntax)
windowrule = workspace 1, match:tag email
windowrule = workspace 1, match:class ^(com\.discordapp\.Discord)$
windowrule = workspace 2, match:tag browser
windowrule = workspace 4 silent, match:tag screenshare
windowrule = workspace 4, match:class ^(Postman|Spotify)$
windowrule = workspace 5, match:tag gamestore
windowrule = workspace 6 silent, match:class ^(virt-manager|.virt-manager-wrapped)$
windowrule = workspace 7, match:tag im
windowrule = workspace 8, match:tag games
windowrule = workspace 9 silent, match:tag multimedia
windowrule = workspace 3 silent, match:class ^(code)$
windowrule = workspace special:ferdium silent, match:class [Ff]erdium
windowrule = workspace special:ferdium silent, match:class WhatsApp Desktop
windowrule = workspace special:magic silent, match:class [Oo]bsidian

# 3. FLOATING & POSITIONING (fixed bools)
windowrule = float on , match:tag KooL_Cheat
windowrule = float on, match:tag wallpaper
windowrule = float on, match:tag settings
windowrule = float on, match:tag popup_settings
windowrule = float on, match:tag viewer
windowrule = float on, match:tag KooL-Settings
windowrule = float on, match:class ^([Zz]oom|onedriver|onedriver-launcher|mpv|com.github.rafostar.Clapper|[Qq]alculate-gtk)$
windowrule = float on, match:class ^(org.gnome.Calculator)$, match:title ^(Calculator)$
windowrule = float on, match:title ^(Picture-in-Picture|Authentication Required|Add Folder to Workspace|Save As|SDDM Background)$
windowrule = center on, match:tag KooL_Cheat
windowrule = center on, match:tag KooL-Settings
windowrule = center on, match:title ^(ROG Control|Keybindings|Authentication Required|Add Folder to Workspace|Save As|SDDM Background)$
windowrule = match:title ^(Open File)(.*)$, center on
windowrule = match:title ^(Open File)(.*)$, float on
windowrule = match:title ^(Select a File)(.*)$, center on
windowrule = match:title ^(Select a File)(.*)$, float on
windowrule = match:title ^(Choose wallpaper)(.*)$, center on
windowrule = match:title ^(Choose wallpaper)(.*)$, float on
windowrule = match:title ^(Choose wallpaper)(.*)$, size (monitor_w*.60) (monitor_h*.65)
windowrule = match:title ^(Open Folder)(.*)$, center on
windowrule = match:title ^(Open Folder)(.*)$, float on
windowrule = match:title ^(Save As)(.*)$, center on
windowrule = match:title ^(Save As)(.*)$, float on
windowrule = match:title ^(Library)(.*)$, center on
windowrule = match:title ^(Library)(.*)$, float on
windowrule = match:title ^(File Upload)(.*)$, center on
windowrule = match:title ^(File Upload)(.*)$, float on
windowrule = match:title ^(.*)(wants to save)$, center on
windowrule = match:title ^(.*)(wants to save)$, float on
windowrule = match:title ^(.*)(wants to open)$, center on
windowrule = match:title ^(.*)(wants to open)$, float on

# 4. SIZE & MOVE
windowrule = match:tag popup_settings, size (monitor_w*.45) (monitor_h*.65)
windowrule = match:tag settings, size (monitor_w*.45) (monitor_h*.45)
windowrule = match:title ^(Add Folder to Workspace|Save As)$, size (monitor_w*.45) (monitor_h*.45)
windowrule =  match:title ^(Picture-in-Picture)$,move 72% 7%

# 5. OPACITY (TAG-BASED)
windowrule = opacity 0.98, match:tag browser
windowrule = opacity 0.9 0.8, match:tag projects
windowrule = opacity 0.94 0.86, match:tag im
windowrule = opacity 0.94 0.86, match:tag multimedia
windowrule = opacity 0.94 0.8, match:tag file-manager
windowrule = opacity 0.99 0.99, match:tag terminal
windowrule = opacity 0.8 0.7, match:tag settings
windowrule = opacity 0.95 0.9, match:tag popup_settings
windowrule = opacity 0.82 0.75, match:tag viewer
windowrule = opacity 0.9 0.7, match:tag wallpaper

# 6. OTHER EFFECTS (snake_case + correct bools)
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = keep_aspect_ratio on, match:title ^(Picture-in-Picture)$
windowrule = no_blur on, match:tag games
windowrule = fullscreen on, match:tag games
windowrule = no_blur on, match:tag multimedia_video
windowrule = opacity 1.0, match:tag multimedia_video
windowrule = idle_inhibit fullscreen, match:fullscreen true

# 7. CORRECTED LAYERRULES
layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = ignore_alpha 0.1, match:namespace swaync-notification-window
layerrule = xray 0, match:namespace swaync-control-center
layerrule = xray 0, match:namespace swaync-notification-window
layerrule = blur on, match:namespace wlogout
layerrule = blur on, match:namespace rofi

# Extras
exec-once = ferdium --use-gl=desktop --enable-features=UseOzonePlatform,WebRTCPipeWireCapturer --ozone-platform=wayland
